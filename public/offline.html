<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c5c50">
  <title>Hors ligne — NdamStore</title>
  <style>
    :root {
      --brand: #0c5c50;
      --ink: #13201c;
      --muted: #5f726c;
      --panel: #ffffff;
      --surface: #eef5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      font-family: "Sora", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -10%, rgba(20, 122, 106, .16), transparent 42%),
        linear-gradient(180deg, #f4faf7 0%, var(--surface) 100%);
    }
    .card {
      width: min(100%, 26rem);
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(19, 32, 28, .08);
      border-radius: 1.1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 30px rgba(8, 63, 55, .07);
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 .5rem;
      font-family: Georgia, "Fraunces", serif;
      font-size: 1.45rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.5;
      font-size: .95rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: .75rem;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: .75rem 1.25rem;
      cursor: pointer;
      min-height: 2.75rem;
      width: 100%;
    }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="NdamStore" width="72" height="72">
    <h1>Vous êtes hors ligne</h1>
    <p>NdamStore a besoin d’une connexion pour charger vos données. Vérifiez le réseau puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
