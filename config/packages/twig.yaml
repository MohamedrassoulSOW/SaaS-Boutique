twig:
    file_name_pattern: '*.twig'
    form_themes: ['bootstrap_5_layout.html.twig']
    globals:
        app_name: 'NdamStore'
        app_tagline: 'La réussite de votre commerce.'
        app_logo: 'images/ndamstore-logo.jpg'
        currency: 'FCFA'
        currency_code: 'XOF'
        platform: '%app.platform%'

when@test:
    twig:
        strict_variables: true
