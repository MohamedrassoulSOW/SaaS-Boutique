name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP syntax
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l
          find tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Regression checks
        run: php tools/regression_check.php

      - name: Symfony lint container (test env)
        run: php bin/console lint:container --env=test

      - name: Twig lint
        run: php bin/console lint:twig templates --env=test

      - name: Preflight
        run: php tools/preflight_check.php
